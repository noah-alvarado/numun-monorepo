version: v2
managed:
  enabled: true
  disable:
    # Don't rewrite go_package on imported deps — they keep their own paths.
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/numun/numun/api/internal/gen
# Plugin versions are pinned so codegen stays in step with the runtime
# libraries in api/go.mod and portal/package.json (and CI's drift check).
plugins:
  # Go server stubs
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../internal/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: ../internal/gen
    opt: paths=source_relative

  # TypeScript client stubs
  - remote: buf.build/bufbuild/es:v2.12.0
    out: ../../portal/src/gen
    opt:
      - target=ts
  - remote: buf.build/connectrpc/es:v1.6.1
    out: ../../portal/src/gen
    opt:
      - target=ts
