name: site preview

# Builds the site for a PR and serves it at https://pr-<n>.preview.<test apex>.
# Decap's editorial workflow shows the `deploy/preview` commit status as its
# "View preview" link. Previews always deploy to the test account; the
# deploy-preview role can only write the previews bucket.
#
# "Site preview" is a required check on main, so the workflow runs on every
# PR. It only builds and deploys when the PR touches the site; otherwise (and
# for fork PRs, which get no AWS credentials) the job is skipped, which
# counts as passing.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read
  statuses: write
  pull-requests: write # sticky preview-link comment

concurrency:
  group: site-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ENV: test
  PR: pr-${{ github.event.pull_request.number }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  COMMENT_MARKER: "<!-- site-preview -->"

jobs:
  # Decides whether there's anything to preview. Kept separate from deploy so
  # PRs that don't touch the site don't create empty test-preview deployments.
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "Fork PRs get no AWS credentials; skipping the preview."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -Eq '^(site/|content/|packages/tailwind-tokens/|e2e/site/|e2e/fixtures\.ts$|e2e/playwright\.deployed\.config\.ts$|e2e/package\.json$|pnpm-lock\.yaml$|\.nvmrc$|scripts/gh-api-retry\.sh$|\.github/workflows/site-preview\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No site changes; skipping the preview."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The required check. A job skipped by its `if` counts as passing.
  deploy:
    name: Site preview
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: test-preview
      url: ${{ steps.urls.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - name: load env config
        run: scripts/load-env.sh "$ENV"
      - id: urls
        name: derive preview URL + role
        run: |
          echo "preview=https://${PR}.preview.${APEX_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=https://${PR}.preview.${APEX_DOMAIN}" >> "$GITHUB_ENV"
          echo "DEPLOY_ROLE_PREVIEW_ARN=arn:aws:iam::${AWS_ACCOUNT_ID}:role/numun-${ENV_NAME}-deploy-preview" >> "$GITHUB_ENV"
          echo "BUCKET=numun-${ENV_NAME}-previews" >> "$GITHUB_ENV"
      - name: mark preview pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/gh-api-retry.sh "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending -f context=deploy/preview -f description="Building preview"
      - name: Fetch active conference
        # Same fallback behavior as site.yml.
        run: |
          mkdir -p content/_generated
          response=$(curl -sS --max-time 10 -X POST \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data '{}' \
            "https://api.${APEX_DOMAIN}/numun.v1.PublicService/GetActiveConference" \
            || true)
          if echo "$response" | jq -e '.conference' >/dev/null 2>&1; then
            echo "$response" | jq '.conference // null' > content/_generated/active-conference.json
          else
            echo '{"conferenceId": null}' > content/_generated/active-conference.json
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: build site
        # Canonicals use the preview's own URL; links to the portal/API use
        # test's, exactly like a test build.
        env:
          SITE_BASE: ${{ env.PREVIEW_URL }}
          SITE_APEX: ${{ env.APEX_DOMAIN }}
          PUBLIC_VERSION: ${{ env.PR }}
        run: pnpm --filter @numun/site build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_PREVIEW_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Same object metadata as site.yml (notably the HTML charset), except
      # no-cache so every push shows up immediately.
      - name: upload preview
        run: |
          aws s3 sync site/dist/ "s3://${BUCKET}/${PR}/" \
            --delete \
            --cache-control "no-cache" \
            --exclude "*.html"
          aws s3 sync site/dist/ "s3://${BUCKET}/${PR}/" \
            --delete \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8" \
            --exclude "*" --include "*.html"
      - name: mark preview ready
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/gh-api-retry.sh "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context=deploy/preview \
            -f target_url="$PREVIEW_URL" -f description="Preview ready"
      # Reviewers find the preview through this comment, so failing to post
      # it (after retries) fails the check.
      - name: comment preview link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '%s\n**Site preview:** %s\n\nBuilt from %s. Updates on every push; removed when the PR closes.' \
            "$COMMENT_MARKER" "$PREVIEW_URL" "${HEAD_SHA:0:7}")
          id=$(scripts/gh-api-retry.sh "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${COMMENT_MARKER}\"))][0].id // empty" | head -1)
          if [ -n "$id" ]; then
            scripts/gh-api-retry.sh -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            scripts/gh-api-retry.sh "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
      # The preview must behave exactly like test: the same smoke tests site.yml
      # runs after each test deploy.
      - name: Install Chromium
        run: pnpm --filter @numun/e2e exec playwright install --with-deps chromium
      - name: smoke-test the preview
        env:
          DEPLOYED_SITE_URL: ${{ env.PREVIEW_URL }}
          SITE_APEX: ${{ env.APEX_DOMAIN }}
        run: pnpm --filter @numun/e2e exec playwright test -c playwright.deployed.config.ts
      - name: upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-smoke-report
          path: |
            e2e/playwright-report-deployed/
            e2e/test-results-deployed/
          retention-days: 7
      # Only when the preview itself didn't go up: if just the comment
      # failed, the preview is live and Decap's link to it must keep working.
      - name: mark preview failed
        if: failure() && steps.ready.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/gh-api-retry.sh "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure -f context=deploy/preview \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="Preview build failed"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: test-preview
    steps:
      - uses: actions/checkout@v4
      - name: load env config
        run: scripts/load-env.sh "$ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/numun-${{ env.ENV_NAME }}-deploy-preview
          aws-region: ${{ env.AWS_REGION }}
      - name: delete preview
        run: aws s3 rm "s3://numun-${ENV_NAME}-previews/${PR}/" --recursive
      - name: mark comment removed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${COMMENT_MARKER}\"))][0].id // empty" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              -f body="$(printf '%s\n**Site preview:** removed (PR closed).' "$COMMENT_MARKER")" >/dev/null
          fi
