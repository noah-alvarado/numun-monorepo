name: E2E

# Playwright against the local stack (DDB Local + LocalStack, Go API with
# LOCAL_HTTP=true, portal via vite preview). Not a required check yet — make
# it required once it has run green for a while. See /e2e and DEVELOPERS.md §5.

on:
  pull_request:
    paths:
      - "portal/**"
      - "api/**"
      - "e2e/**"
      - "docker-compose.yml"
      - "scripts/localstack-init.sh"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @numun/e2e exec playwright install --with-deps chromium
      - name: Start DDB Local + LocalStack and seed
        run: make e2e-stack
      - name: Run Playwright
        run: pnpm --filter @numun/e2e run e2e
      - name: Upload report + step screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
