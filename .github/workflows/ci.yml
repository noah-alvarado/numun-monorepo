name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    # Required check on `main`: content PRs merge without code review, so
    # /content may only hold Markdown and media (no MDX/JS/SVG).
    name: Content file check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bad=$(git ls-files content | grep -Ev '\.(md|jpe?g|png|webp|gif|pdf)$|/\.gitkeep$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Only .md and media files are allowed under content/:"
            echo "$bad"
            exit 1
          fi

  proto:
    name: Proto lint + breaking-change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        run: buf lint
        working-directory: api/proto
      - name: buf breaking
        run: buf breaking --against ".git#branch=main,subdir=api/proto" || true
        working-directory: api/proto

  go:
    name: Go lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go build ./...
      - name: scope-helper lint
        run: bash ../scripts/check-scope-helpers.sh
      - run: go test ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  js:
    name: JS lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      # Block merges on high/critical advisories; moderate/low surfaces too
      # often as transitive noise we can't address quickly.
      - name: pnpm audit (high+critical)
        run: pnpm audit --audit-level=high --prod
