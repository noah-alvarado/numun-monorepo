name: deploy api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "infra/api/**"
      - "infra/envs/**"
      - "scripts/load-env.sh"
      - "scripts/load-stack-outputs.sh"
      - ".github/workflows/api.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy to
        required: false
        default: test
        type: choice
        options: [test, prod]
      bump:
        description: Which semver component to bump
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  id-token: write # OIDC
  contents: write # push version tags

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENV: ${{ inputs.environment || 'test' }}
    environment:
      name: ${{ inputs.environment || 'test' }}
      # The full URL is composed in the "derive deploy role + stack name"
      # step below from the env YAML's APEX_DOMAIN, but GitHub's
      # `environment.url` is evaluated before that step runs. Hardcode
      # the two known apex shapes here so the Deployments dashboard
      # links to the right host.
      url: ${{ inputs.environment == 'prod' && 'https://api.numun.org' || 'https://api.test.numun.org' }}
    steps:
      - uses: actions/checkout@v4
      - name: load env config
        run: scripts/load-env.sh "$ENV"
      - name: derive deploy role + stack name
        run: |
          echo "DEPLOY_ROLE_API_ARN=arn:aws:iam::${AWS_ACCOUNT_ID}:role/numun-${ENV_NAME}-deploy-api" >> "$GITHUB_ENV"
          echo "STACK_NAME=numun-${ENV_NAME}-api" >> "$GITHUB_ENV"
      - name: compute version
        id: version
        uses: ./.github/actions/compute-version
        with:
          app: api
          bump: ${{ inputs.bump || 'patch' }}
          version-file: api/VERSION
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_API_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: load base-data stack outputs
        # Exports CognitoUserPoolId, CognitoUserPoolArn, CognitoClientId,
        # TableName, bucket ARNs, AlarmsTopicArn — all as job env vars.
        run: scripts/load-stack-outputs.sh "numun-${ENV_NAME}-base-data"
      - name: sam build
        working-directory: infra/api
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: sam build
      - name: sam deploy
        working-directory: infra/api
        run: |
          # Sentry DSN is no longer passed as a stack parameter (M14).
          # The Lambda reads it at cold-start from
          # /numun/${ENV}/sentry/dsn via observability.fetchSSMParam.
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$SAM_ARTIFACTS_BUCKET" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Env=$ENV" \
              "RootDomain=$ROOT_DOMAIN" \
              "EnvSubdomain=$ENV_SUBDOMAIN" \
              "CommitSha=${{ github.sha }}" \
              "ReleaseVersion=${{ steps.version.outputs.version }}" \
              "CloudFrontCertificateArn=$CDN_CERTIFICATE_ARN" \
              "OriginVerifySecret=/numun/$ENV/api/origin_verify_secret" \
              "EnforceOriginVerify=$ENFORCE_ORIGIN_VERIFY" \
              "HostedZoneId=$HOSTED_ZONE_ID" \
              "CognitoUserPoolId=$CognitoUserPoolId" \
              "CognitoUserPoolArn=$CognitoUserPoolArn" \
              "CognitoClientId=$CognitoClientId"
      - name: get API endpoints
        id: api
        run: |
          output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          BASE_URL=$(output ApiBaseUrl)
          ORIGIN_URL=$(output HttpApiEndpoint)
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "origin_url=$ORIGIN_URL" >> "$GITHUB_OUTPUT"
          echo "origin_verify_enforced=$(output OriginVerifyEnforced)" >> "$GITHUB_OUTPUT"
          echo "API base URL: $BASE_URL (origin: $ORIGIN_URL)"
      - name: smoke check
        run: |
          # Up to 2 min: allows for alias-record TTL when DNS has just moved.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.api.outputs.base_url }}/v1/health" || true)
            echo "attempt $i → $code"
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "smoke check failed"; exit 1; }
          # Once enforced, the raw execute-api URL must reject requests that
          # bypass CloudFront. In report-only mode it still serves them.
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.api.outputs.origin_url }}/v1/health" || true)
          echo "direct origin → $code (enforced=${{ steps.api.outputs.origin_verify_enforced }})"
          if [ "$code" != "403" ]; then
            if [ "${{ steps.api.outputs.origin_verify_enforced }}" = "true" ]; then
              echo "origin is reachable without X-Origin-Verify"; exit 1
            fi
            echo "::warning::origin verify is report-only; execute-api is reachable directly"
          fi
      - name: tag release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
